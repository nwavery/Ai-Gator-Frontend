<div class="container mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold mb-6">Submit a New AI Tool</h1>

  <form [formGroup]="toolForm" (ngSubmit)="onSubmit()" class="space-y-6 bg-white p-8 rounded-lg shadow-md">

    <!-- Name -->
    <div>
      <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Tool Name</label>
      <input type="text" id="name" formControlName="name" required
             class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-gray-900"
             [ngClass]="{ 'border-red-500': toolForm.get('name')?.invalid && toolForm.get('name')?.touched }">
      <div *ngIf="toolForm.get('name')?.invalid && toolForm.get('name')?.touched" class="text-red-600 text-sm mt-1">
        Tool name is required.
      </div>
    </div>

    <!-- Description -->
    <div>
      <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
      <textarea id="description" formControlName="description" required rows="4"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-gray-900"
                [ngClass]="{ 'border-red-500': toolForm.get('description')?.invalid && toolForm.get('description')?.touched }"></textarea>
      <div *ngIf="toolForm.get('description')?.invalid && toolForm.get('description')?.touched" class="text-red-600 text-sm mt-1">
        Description is required.
      </div>
    </div>

    <!-- Website URL -->
    <div>
      <label for="websiteUrl" class="block text-sm font-medium text-gray-700 mb-1">Website URL</label>
      <input type="url" id="websiteUrl" formControlName="websiteUrl" required
             class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-gray-900"
             [ngClass]="{ 'border-red-500': toolForm.get('websiteUrl')?.invalid && toolForm.get('websiteUrl')?.touched }">
      <div *ngIf="toolForm.get('websiteUrl')?.invalid && toolForm.get('websiteUrl')?.touched" class="text-red-600 text-sm mt-1">
        <span *ngIf="toolForm.get('websiteUrl')?.errors?.['required']">Website URL is required.</span>
        <span *ngIf="toolForm.get('websiteUrl')?.errors?.['pattern']">Please enter a valid URL (e.g., https://example.com).</span>
      </div>
    </div>

    <!-- Category -->
    <div>
      <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
      <select id="category" formControlName="category" required
              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 bg-white text-gray-900"
              [ngClass]="{ 'border-red-500': toolForm.get('category')?.invalid && toolForm.get('category')?.touched }">
        <option [ngValue]="null" disabled>Select a category...</option>
        <!-- Use async pipe to get categories from the observable -->
        <option *ngFor="let category of categories$ | async" [ngValue]="category" class="text-gray-900">
          {{ category.name }}
        </option>
      </select>
      <div *ngIf="toolForm.get('category')?.invalid && toolForm.get('category')?.touched" class="text-red-600 text-sm mt-1">
        Category is required.
      </div>
    </div>

    <!-- Pricing (Placeholder) -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Pricing Model</label>
      <div class="space-y-2">
        <!-- TODO: Replace with actual pricing options -->
        <div class="flex items-center">
          <input type="radio" id="price-paid" formControlName="pricing" value="Paid" class="focus:ring-indigo-500 h-4 w-4 text-indigo-600 border-gray-300">
          <label for="price-paid" class="ml-3 block text-sm text-gray-900">Paid</label>
        </div>
         <div class="flex items-center">
          <input type="radio" id="price-free" formControlName="pricing" value="Free" class="focus:ring-indigo-500 h-4 w-4 text-indigo-600 border-gray-300">
          <label for="price-free" class="ml-3 block text-sm text-gray-900">Free</label>
        </div>
         <div class="flex items-center">
          <input type="radio" id="price-freemium" formControlName="pricing" value="Freemium" class="focus:ring-indigo-500 h-4 w-4 text-indigo-600 border-gray-300">
          <label for="price-freemium" class="ml-3 block text-sm text-gray-900">Freemium</label>
        </div>
      </div>
       <div *ngIf="toolForm.get('pricing')?.invalid && toolForm.get('pricing')?.touched" class="text-red-600 text-sm mt-1">
        Pricing model is required.
      </div>
    </div>

    <!-- Tags -->
    <div>
      <label for="tags" class="block text-sm font-medium text-gray-700 mb-1">Tags (comma-separated)</label>
      <input type="text" id="tags" formControlName="tags"
             class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-gray-900">
       <p class="text-xs text-gray-500 mt-1">Optional. Help users find your tool.</p>
    </div>

    <!-- Submission Error -->
    <div *ngIf="submissionError" class="p-4 bg-red-100 border border-red-400 text-red-700 rounded">
      {{ submissionError }}
    </div>

    <!-- Submit Button -->
    <div>
      <button type="submit" 
              [disabled]="toolForm.invalid || isSubmitting"
              class="w-full flex justify-center items-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed">
        <span *ngIf="!isSubmitting">Submit Tool</span>
        <span *ngIf="isSubmitting">
          <!-- Basic Spinner -->
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Submitting...
        </span>
      </button>
    </div>

  </form>
</div>
