<div class="mb-8">
  <!-- Search Bar -->
  <div class="mb-6">
    <input type="search" placeholder="Search..."
           [formControl]="searchInput"
           class="w-full p-3 bg-gray-800 border border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent">
  </div>

  <!-- Category Checkboxes -->
  <div class="mb-6">
    <h3 class="text-lg font-semibold mb-3 text-white text-center">Filter by Category:</h3>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-x-4 gap-y-2">
      <div *ngFor="let category of categories$ | async"
           class="flex items-center">
        <input type="checkbox"
               [id]="'cat-' + category.id"
               [name]="category.name"
               [value]="category.name"
               [checked]="selectedCategories.has(category.name)"
               (change)="onCategoryChange($event, category.name)"
               class="form-checkbox h-4 w-4 text-teal-600 bg-gray-700 border-gray-600 rounded focus:ring-teal-500 focus:ring-offset-0 focus:ring-offset-gray-800">
        <label [for]="'cat-' + category.id" class="ml-2 text-sm text-gray-300 select-none">{{ category.name }}</label>
      </div>
    </div>
  </div>

  <!-- Pricing Filters -->
  <div class="mb-6">
     <h3 class="text-lg font-semibold mb-3 text-white text-center">Pricing:</h3>
     <div class="flex flex-wrap justify-center gap-x-4 gap-y-2">
        <label *ngFor="let option of pricingOptions" class="flex items-center text-sm text-gray-300">
          <input type="checkbox"
                 [id]="'price-' + option"
                 [name]="'pricing'"
                 [value]="option"
                 [checked]="selectedPricing.has(option)"
                 (change)="onPricingChange($event, option)"
                 class="form-checkbox h-4 w-4 text-teal-600 bg-gray-700 border-gray-600 rounded focus:ring-teal-500 focus:ring-offset-0 focus:ring-offset-gray-800 mr-2">
           {{ option }}
        </label>
     </div>
  </div>

</div>

<!-- Separator and Sorting -->
<div class="border-t border-gray-700 my-6 md:my-8 pt-6 md:pt-8 flex justify-end">
  <div class="relative inline-block text-left">
    <div>
      <button (click)="toggleSortDropdown()" type="button" class="inline-flex justify-center w-full rounded-md border border-gray-600 shadow-sm px-4 py-2 bg-gray-800 text-sm font-medium text-gray-300 hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-800 focus:ring-teal-500" id="options-menu" aria-haspopup="true" [attr.aria-expanded]="isSortDropdownOpen">
        {{ getSelectedSortLabel() }}
        <!-- Heroicon name: solid/chevron-down -->
        <svg class="-mr-1 ml-2 h-5 w-5 transition-transform duration-200" [class.rotate-180]="isSortDropdownOpen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>

    <!-- Dropdown menu -->
    <div *ngIf="isSortDropdownOpen"
         class="origin-top-right absolute right-0 mt-2 w-56 rounded-md shadow-lg bg-gray-700 ring-1 ring-black ring-opacity-5 focus:outline-none z-10"
         role="menu" aria-orientation="vertical" aria-labelledby="options-menu">
      <div class="py-1" role="none">
        <button *ngFor="let option of sortOptions"
                (click)="selectSortOption(option.value)"
                [class.bg-gray-600]="option.value === selectedSortOption"
                class="block w-full text-left px-4 py-2 text-sm text-gray-200 hover:bg-gray-600 hover:text-white"
                role="menuitem">
          {{ option.label }}
        </button>
      </div>
    </div>
  </div>
</div>
