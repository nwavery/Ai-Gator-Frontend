<div *ngIf="tool$ | async as tool; else loadingTool" class="bg-gray-800 p-6 rounded-lg shadow-lg">

  <!-- Back Button (optional) -->
  <!-- <a routerLink="/" class="text-teal-400 hover:text-teal-300 mb-4 inline-block">&larr; Back to list</a> -->

  <div class="flex flex-col md:flex-row gap-6">
    <!-- Left Column: Image & Visit Button -->
    <div class="md:w-1/3 flex flex-col items-center">
      <!-- Display image if URL exists -->
      <div *ngIf="tool.imageUrl" class="w-full h-48 bg-gray-700 rounded mb-4 flex items-center justify-center overflow-hidden">
        <img [src]="tool.imageUrl" [alt]="tool.name" class="w-full h-full object-cover">
      </div>
      <!-- Placeholder if no image -->
      <div *ngIf="!tool.imageUrl" class="w-full h-48 bg-gray-700 rounded mb-4 flex items-center justify-center text-gray-500">
        <span>Image Placeholder</span>
      </div>

      <!-- Use affiliate link if available, otherwise websiteUrl -->
      <a [href]="tool.affiliateLink || tool.websiteUrl" target="_blank" rel="noopener noreferrer"
         class="w-full bg-teal-500 hover:bg-teal-600 text-white text-center font-bold py-3 px-4 rounded transition duration-200 ease-in-out">
        Visit {{ tool.name }}
      </a>
      <!-- Add other info like pricing model, upvotes here if needed -->
    </div>

    <!-- Right Column: Title, Description, Tags -->
    <div class="md:w-2/3">
      <h1 class="text-3xl font-bold mb-3 text-white">{{ tool.name }}</h1>
      <p class="text-gray-300 mb-6">{{ tool.description }}</p>

      <!-- Tags/Categories -->
      <div class="mb-4">
        <h3 class="text-lg font-semibold mb-2 text-white">Category:</h3>
        <!-- Assuming tool object has a category property with a name -->
        <span *ngIf="tool.category" class="inline-block bg-gray-700 text-teal-300 text-sm px-3 py-1 rounded mr-2 mb-2">
          {{ tool.category.name }}
        </span>
         <!-- Add more tags later if tool model supports multiple tags/categories -->
      </div>

       <!-- Add other sections like Special Offer, Share, Videos later -->

    </div>
  </div>
</div>

<ng-template #loadingTool>
  <p class="text-center text-gray-400">Loading tool details...</p>
</ng-template>
