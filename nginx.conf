server {
  listen 8080;
  server_name localhost; # This doesn't strictly matter inside the container

  # Set the root directory for static files
  root /usr/share/nginx/html;
  index index.html index.htm;

  # Default location block: Serve static files or fallback to index.html
  location / {
    # First attempt to serve request as file, then
    # as directory, then fall back to displaying index.html
    try_files $uri $uri/ /index.html;
  }

  # Optional: Add specific error pages if needed
  # error_page 500 502 503 504 /50x.html;
  # location = /50x.html {
  #   root /usr/share/nginx/html;
  # }

  # Optional: Add gzip compression for better performance
  # gzip on;
  # gzip_vary on;
  # gzip_proxied any;
  # gzip_comp_level 6;
  # gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
} 